# alembic.ini - Configuração do Alembic para Confecção Alfa
[alembic]
# Localização dos scripts de migração
script_location = alembic

# Template utilizado para gerar novos scripts de revisão
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Adiciona o diretório da aplicação ao sys.path para importações dos models
prepend_sys_path = .

# Fuso horário para timestamps
timezone = America/Fortaleza

# Formato de data/hora
# truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
